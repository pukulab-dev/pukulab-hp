<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!-- Google Search Console 認証 -->
    <meta
      name="google-site-verification"
      content="16kHL1mWu3SBwTGi3w1Utb-ums39w5IYHYovZRSBDXY"
    />

    <!-- Google Analytics 4 -->
    <script>
      (() => {
        const measurementId = "G-6WET7857MJ";
        const allowedHosts = new Set(["pukulab.com", "www.pukulab.com"]);

        // localhostやVercel Previewの確認アクセスは本番GA4へ送らない。
        if (!allowedHosts.has(window.location.hostname)) {
          return;
        }

        window.dataLayer = window.dataLayer || [];
        window.gtag =
          window.gtag ||
          function gtag() {
            window.dataLayer.push(arguments);
          };

        window.gtag("js", new Date());

        // React Router側でページビューを手動送信するため、
        // Googleタグ読み込み時の自動page_viewは停止する。
        window.gtag("config", measurementId, {
          send_page_view: false,
        });

        const gaScript = document.createElement("script");
        gaScript.async = true;
        gaScript.src = `https://www.googletagmanager.com/gtag/js?id=${measurementId}`;
        document.head.appendChild(gaScript);
      })();
    </script>

    <!-- SEO情報はsrc/seoConfig.jsを元にビルド時と画面遷移時に設定する -->
    <title>Puku Lab</title>

    <!-- Favicon / App Icon -->
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="shortcut icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <!-- Browser / Device Settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="ja" />
    <meta name="theme-color" content="#123b2f" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
